<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MelodySound ~発車メロディ~</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for Backup/Restore -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --liquid-filter: url(#glass-distortion);
            --liquid-blur: blur(4px);
            --liquid-tint-opacity: 0.2;
            --liquid-shine-opacity: 0.5;
            --app-bg: #f2f2f7;
            --theme-color: #007aff;
        }

        /* --- Liquid Glass Core Styles --- */
        .liquidGlass-wrapper {
            position: relative;
            display: flex;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.5);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .liquidGlass-effect {
            position: absolute;
            z-index: 0;
            inset: 0;
            backdrop-filter: var(--liquid-blur);
            filter: var(--liquid-filter);
            border-radius: inherit;
        }

        .liquidGlass-tint {
            z-index: 1;
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, var(--liquid-tint-opacity));
            transition: background 0.3s ease;
            border-radius: inherit;
        }
        
        /* 色付きガラス用クラス */
        .liquidGlass-tint.colored {
            background: var(--glass-color, rgba(255, 255, 255, 0.2));
            mix-blend-mode: overlay;
        }

        .liquidGlass-shine {
            position: absolute;
            inset: 0;
            z-index: 2;
            box-shadow: inset 2px 2px 1px 0 rgba(255, 255, 255, var(--liquid-shine-opacity)),
                inset -1px -1px 1px 1px rgba(255, 255, 255, 0.3);
            border-radius: inherit;
            pointer-events: none;
        }

        .liquidGlass-content {
            z-index: 3;
            width: 100%;
            position: relative;
        }

        /* --- Global Layout --- */
        html, body {
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            background-color: var(--app-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #1c1c1e;
        }

        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem 1rem 6rem 1rem;
        }

        /* --- Tab Bar --- */
        .tab-bar-container {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 0 1rem 1rem 1rem;
            z-index: 100;
        }
        .tab-bar.liquidGlass-wrapper {
            height: 65px;
            max-width: 600px;
            margin: 0 auto;
            padding: 0.5rem;
            justify-content: space-around;
            align-items: center;
            background: rgba(255,255,255,0.4);
        }
        .tab-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: rgba(0, 0, 0, 0.5);
            background: none;
            border: none;
            cursor: pointer;
            width: 60px;
            transition: color 0.2s;
        }
        .tab-button.active { color: var(--theme-color); transform: translateY(-2px); }
        .tab-button svg { width: 24px; height: 24px; margin-bottom: 2px; }

        /* --- UI Elements --- */
        .glass-card {
            margin-bottom: 1rem;
            padding: 1rem;
        }
        
        .glass-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            color: #333;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .glass-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.4); }
        .glass-btn.primary { background: var(--theme-color); color: white; border: none; }
        
        .glass-input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            margin-bottom: 0.5rem;
        }
        .glass-input:focus { outline: none; background: rgba(255,255,255,0.4); }

        /* --- Switch UI (Realistic ON/OFF) --- */
        .switch-box {
            background: linear-gradient(135deg, #e0e0d0, #c0c0b0);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 
                5px 5px 10px rgba(0,0,0,0.2),
                inset 2px 2px 5px rgba(255,255,255,0.5);
            width: 140px;
            height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid #999;
        }
        .switch-plate {
            background: #d8d8c8;
            border: 1px solid #a0a090;
            border-radius: 4px;
            padding: 2px 6px;
            margin-bottom: 15px;
            font-size: 10px;
            font-weight: bold;
            color: #555;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .switch-bezel {
            background: #b0b0a0;
            border-radius: 12px;
            padding: 6px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3), 1px 1px 0 rgba(255,255,255,0.4);
            display: flex;
            flex-direction: column;
            gap: 0;
            border: 2px solid #909080;
        }
        .mech-btn {
            width: 70px;
            height: 70px;
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            font-weight: bold;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }
        .mech-btn.on {
            background: #2a2a2a;
            border-radius: 6px 6px 0 0;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.4);
            border-bottom: 1px solid #444;
        }
        .mech-btn.off {
            background: #d00000;
            border-radius: 0 0 6px 6px;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.2), 0 2px 4px rgba(0,0,0,0.4);
            border-top: 1px solid #900;
        }
        .mech-btn:active { box-shadow: inset 0 0 15px rgba(0,0,0,0.5); transform: scale(0.98); }
        .mech-btn.active-state {
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            transform: scale(0.96);
            filter: brightness(0.8);
        }

        /* --- Modals & Overlays --- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden;
            transition: 0.3s;
        }
        .modal-overlay.visible { opacity: 1; visibility: visible; }
        .modal-content {
            width: 90%; max-width: 400px; max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.95); transition: 0.3s;
        }
        .modal-overlay.visible .modal-content { transform: scale(1); }

        /* --- File Manager Tree --- */
        .file-node {
            padding: 8px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .folder-header {
            background: rgba(255,255,255,0.3);
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            display: flex; justify-content: space-between;
        }

        /* --- Station List --- */
        .station-item {
            user-select: none; /* for long press */
            transition: transform 0.2s;
        }
        .station-item:active { transform: scale(0.98); }
        
        .playing-indicator {
            width: 10px; height: 10px; background: #34c759; border-radius: 50%;
            box-shadow: 0 0 10px #34c759; display: none;
        }
        .playing .playing-indicator { display: block; }

    </style>
</head>
<body>

    <!-- Main Content -->
    <main class="main-content">
        
        <!-- 1. Button Tab (Operation) -->
        <div id="tab-buttons" class="">
            <header class="mb-6 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">操作盤</h1>
                <div class="text-xs text-gray-500 bg-white/50 px-2 py-1 rounded-lg">MelodySound</div>
            </header>

            <!-- Station Info Display -->
            <div class="liquidGlass-wrapper glass-card mb-6" id="current-station-display" style="--glass-color: rgba(200,200,200,0.3);">
                <div class="liquidGlass-effect"></div>
                <div class="liquidGlass-tint colored"></div>
                <div class="liquidGlass-shine"></div>
                <div class="liquidGlass-content flex flex-col items-center text-center p-4">
                    <h2 class="text-3xl font-bold mb-1" id="disp-station-name">未選択</h2>
                    <div class="w-full h-1 bg-gray-300 my-2 rounded-full overflow-hidden">
                        <div id="disp-line-color-bar" class="h-full w-full bg-gray-400"></div>
                    </div>
                    <p class="text-sm font-semibold opacity-70" id="disp-line-name">路線リストから駅を選択してください</p>
                    
                    <div class="mt-4 w-full text-left text-xs space-y-1 bg-white/20 p-2 rounded">
                        <div class="flex justify-between"><span>発車:</span> <span id="disp-melody-name" class="font-mono truncate w-32 text-right">-</span></div>
                        <div class="flex justify-between"><span>接近:</span> <span id="disp-approach-melody-name" class="font-mono truncate w-32 text-right">-</span></div>
                    </div>
                </div>
            </div>

            <!-- Main Controls -->
            <div class="flex flex-col items-center gap-8">
                
                <!-- The Switch -->
                <div class="switch-box">
                    <div class="switch-plate">
                        BUZZER<br>SW
                    </div>
                    <div class="switch-bezel">
                        <button id="btn-on" class="mech-btn on">ON</button>
                        <button id="btn-off" class="mech-btn off">OFF</button>
                    </div>
                    <div class="absolute bottom-2 text-[10px] text-gray-500 font-mono">DC24V</div>
                </div>

                <!-- Sub Controls -->
                <div class="grid grid-cols-2 gap-4 w-full max-w-xs">
                    <button id="btn-approach" class="liquidGlass-wrapper h-20 active:scale-95 transition-transform">
                        <div class="liquidGlass-effect"></div>
                        <div class="liquidGlass-tint"></div>
                        <div class="liquidGlass-shine"></div>
                        <div class="liquidGlass-content flex flex-col items-center justify-center p-2 text-gray-700">
                            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                            <span class="text-xs font-bold">接近メロディ</span>
                            <div id="led-approach" class="w-2 h-2 rounded-full bg-gray-400 mt-1 shadow-inner"></div>
                        </div>
                    </button>

                    <button id="btn-close-broadcast" class="liquidGlass-wrapper h-20 active:scale-95 transition-transform">
                        <div class="liquidGlass-effect"></div>
                        <div class="liquidGlass-tint"></div>
                        <div class="liquidGlass-shine"></div>
                        <div class="liquidGlass-content flex flex-col items-center justify-center p-2 text-gray-700">
                            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
                            <span class="text-xs font-bold">ドア閉放送</span>
                        </div>
                    </button>
                </div>

                <!-- Status Text -->
                <div id="playback-status" class="h-6 text-sm font-bold text-blue-600 animate-pulse"></div>

            </div>
        </div>

        <!-- 2. Lines Tab -->
        <div id="tab-lines" class="hidden">
            <header class="mb-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold">路線一覧</h1>
                <button onclick="openLineModal()" class="glass-btn primary text-sm">+ 路線追加</button>
            </header>
            
            <div id="lines-container" class="flex flex-col gap-4">
                <!-- Lines will be injected here -->
            </div>
            
            <div class="mt-8 pt-4 border-t border-gray-300">
                <h3 class="text-sm font-bold mb-2">管理メニュー</h3>
                <div class="flex gap-2">
                    <button onclick="exportLines()" class="glass-btn text-xs flex-1">設定書き出し(.txt)</button>
                    <button onclick="document.getElementById('import-lines-input').click()" class="glass-btn text-xs flex-1">設定読み込み</button>
                </div>
                <input type="file" id="import-lines-input" accept=".txt" class="hidden" onchange="importLines(this)">
            </div>
        </div>

        <!-- 3. IndexedDB Tab -->
        <div id="tab-db" class="hidden">
            <header class="mb-4">
                <h1 class="text-2xl font-bold">ファイル管理</h1>
                <p class="text-xs text-gray-500">音声ファイルはここに保存されます</p>
            </header>

            <div class="liquidGlass-wrapper glass-card mb-4" style="padding: 1rem;">
                <div class="liquidGlass-effect"></div>
                <div class="liquidGlass-tint"></div>
                <div class="liquidGlass-shine"></div>
                <div class="liquidGlass-content flex flex-col gap-2">
                    <h3 class="font-bold text-sm">アクション</h3>
                    <div class="flex gap-2">
                        <label class="glass-btn primary text-center flex-1 cursor-pointer text-sm py-2">
                            + ファイル追加
                            <input type="file" id="db-upload-input" multiple accept="audio/*" class="hidden">
                        </label>
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button onclick="backupDB()" class="glass-btn text-xs flex-1">Zipバックアップ</button>
                        <button onclick="document.getElementById('restore-zip-input').click()" class="glass-btn text-xs flex-1">Zip復元</button>
                         <input type="file" id="restore-zip-input" accept=".zip" class="hidden" onchange="restoreDB(this)">
                    </div>
                </div>
            </div>

            <!-- File Tree -->
            <div id="file-browser" class="flex flex-col gap-2 pb-20">
                <!-- Folders and files injected here -->
            </div>
        </div>

        <!-- 4. Settings Tab -->
        <div id="tab-settings" class="hidden">
            <header class="mb-4">
                <h1 class="text-2xl font-bold">設定</h1>
            </header>
            <div class="liquidGlass-wrapper glass-card">
                <div class="liquidGlass-effect"></div>
                <div class="liquidGlass-tint"></div>
                <div class="liquidGlass-shine"></div>
                <div class="liquidGlass-content p-4 space-y-4">
                    <div class="flex justify-between items-center border-b border-gray-200 pb-2">
                         <span>Liquid Effect</span>
                         <input type="checkbox" checked onchange="toggleEffect(this)">
                    </div>
                    <div>
                         <label class="block text-xs text-gray-500 mb-1">Blur Strength</label>
                         <input type="range" min="0" max="20" value="4" class="w-full" oninput="updateCSS('--liquid-blur', `blur(${this.value}px)`)">
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Tab Bar -->
    <div class="tab-bar-container">
        <nav class="tab-bar liquidGlass-wrapper">
            <div class="liquidGlass-effect"></div>
            <div class="liquidGlass-tint"></div>
            <div class="liquidGlass-shine"></div>
            <div class="liquidGlass-content flex justify-around w-full z-10">
                <button class="tab-button active" data-tab="tab-buttons">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>操作盤</span>
                </button>
                <button class="tab-button" data-tab="tab-lines">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0121 18.382V7.618a1 1 0 01-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                    <span>路線一覧</span>
                </button>
                <button class="tab-button" data-tab="tab-db">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>
                    <span>DB管理</span>
                </button>
                <button class="tab-button" data-tab="tab-settings">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span>設定</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Modals -->
    <!-- Line Editor Modal -->
    <div id="modal-line" class="modal-overlay">
        <div class="modal-content liquidGlass-wrapper" style="background: white;">
             <div class="liquidGlass-content p-4">
                 <h2 class="text-xl font-bold mb-4">路線編集</h2>
                 <input id="edit-line-name" class="glass-input" placeholder="路線名 (例: 山手線)">
                 <div class="flex items-center gap-2 mb-4">
                     <label>Color:</label>
                     <input id="edit-line-color" type="color" class="h-10 w-20">
                 </div>
                 <div class="flex gap-2 justify-end">
                     <button onclick="closeModal('modal-line')" class="glass-btn">キャンセル</button>
                     <button onclick="saveLine()" class="glass-btn primary">保存</button>
                 </div>
             </div>
        </div>
    </div>

    <!-- Station Editor Modal -->
    <div id="modal-station" class="modal-overlay">
        <div class="modal-content liquidGlass-wrapper" style="background: white;">
             <div class="liquidGlass-content p-4 flex flex-col gap-3">
                 <h2 class="text-xl font-bold">駅・音声設定</h2>
                 <input type="hidden" id="edit-station-line-id">
                 <input type="hidden" id="edit-station-index">
                 
                 <label class="text-xs font-bold">駅名</label>
                 <input id="edit-station-name" class="glass-input" placeholder="駅名">
                 
                 <!-- Audio Selectors -->
                 <div class="space-y-2">
                     <div class="flex flex-col">
                         <label class="text-xs">発車メロディ</label>
                         <select id="sel-melody" class="glass-input text-sm"></select>
                     </div>
                     <div class="flex flex-col">
                         <label class="text-xs">接近メロディ</label>
                         <select id="sel-approach-melody" class="glass-input text-sm"></select>
                     </div>
                     <div class="flex flex-col">
                         <label class="text-xs">接近放送</label>
                         <select id="sel-door" class="glass-input text-sm"></select>
                     </div>
                     <div class="flex flex-col">
                         <label class="text-xs">接近放送</label>
                         <select id="sel-approach-cast" class="glass-input text-sm"></select>
                     </div>
                 </div>

                 <div class="flex gap-2 justify-end mt-2">
                     <button onclick="deleteStation()" class="glass-btn text-red-600 border-red-200">削除</button>
                     <button onclick="closeModal('modal-station')" class="glass-btn">キャンセル</button>
                     <button onclick="saveStation()" class="glass-btn primary">保存</button>
                 </div>
             </div>
        </div>
    </div>

    <!-- SVG Filters -->
    <svg style="display: none">
        <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="turbulence"/>
            <feComponentTransfer in="turbulence" result="mapped">
                <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
                <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
                <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
            </feComponentTransfer>
            <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
            <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100" lighting-color="white" result="specLight">
                <fePointLight x="-200" y="-200" z="300" />
            </feSpecularLighting>
            <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage"/>
            <feDisplacementMap in="SourceGraphic" in2="softMap" scale="50" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </svg>

    <script>
        // --- 1. IndexedDB Wrapper ---
        const DB_NAME = "MelodyAppDB";
        const DB_VERSION = 1;
        const STORE_FILES = "files"; // path -> file blob
        // Folder categories
        const FOLDERS = ["/発車メロディ/", "/接近メロディ/", "/ドア閉/", "/接近放送/"];

        let db;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_FILES)) {
                        db.createObjectStore(STORE_FILES, { keyPath: "path" });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e);
            });
        };

        const saveFileToDB = (file, folder) => {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_FILES, "readwrite");
                const store = tx.objectStore(STORE_FILES);
                // Use filename as ID, ensure it starts with folder
                const path = folder + file.name;
                store.put({ path: path, blob: file });
                tx.oncomplete = () => resolve(path);
                tx.onerror = (e) => reject(e);
            });
        };

        const getAllFiles = () => {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_FILES, "readonly");
                const store = tx.objectStore(STORE_FILES);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject();
            });
        };

        const getFileBlob = (path) => {
             return new Promise((resolve) => {
                const tx = db.transaction(STORE_FILES, "readonly");
                const store = tx.objectStore(STORE_FILES);
                const request = store.get(path);
                request.onsuccess = () => resolve(request.result ? request.result.blob : null);
                request.onerror = () => resolve(null);
            });
        };
        
        const deleteFileFromDB = (path) => {
             return new Promise((resolve) => {
                const tx = db.transaction(STORE_FILES, "readwrite");
                store = tx.objectStore(STORE_FILES);
                store.delete(path);
                tx.oncomplete = () => resolve();
             });
        }

        // --- 2. Application State & Logic ---
        
        let appData = {
            lines: [] // { id, name, color, stations: [] }
        };
        // Station object: { name, melodyPath, approachMelodyPath, doorPath, approachCastPath }
        
        // Active Station for Playback
        let currentStation = null;
        let currentLine = null;

        // Audio Objects
        let melodyAudio = new Audio();
        let subAudio = new Audio(); // For door/approach
        let isMelodyPlaying = false;
        let isApproachPlaying = false;

        document.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            loadLinesFromStorage();
            renderLines();
            refreshFileBrowser();
            setupTabs();
            setupControls();
            
            // Initial Selectors population
            updateSelectors();
        });

        // --- Tab Handling ---
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab-button');
            const contents = {
                'tab-buttons': document.getElementById('tab-buttons'),
                'tab-lines': document.getElementById('tab-lines'),
                'tab-db': document.getElementById('tab-db'),
                'tab-settings': document.getElementById('tab-settings')
            };

            tabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    Object.values(contents).forEach(el => el.classList.add('hidden'));
                    contents[btn.dataset.tab].classList.remove('hidden');
                    
                    if(btn.dataset.tab === 'tab-lines') renderLines();
                    if(btn.dataset.tab === 'tab-db') refreshFileBrowser();
                });
            });
        }

        // --- Audio Control Logic (The Switch) ---
        function setupControls() {
            const btnOn = document.getElementById('btn-on');
            const btnOff = document.getElementById('btn-off');
            const btnApproach = document.getElementById('btn-approach');
            const btnCloseCast = document.getElementById('btn-close-broadcast');

            // ON Button: Play Melody Loop
            btnOn.addEventListener('mousedown', async () => {
                if(!currentStation) return alert("駅が選択されていません");
                
                // Visuals
                btnOn.classList.add('active-state');
                btnOff.classList.remove('active-state');
                
                if(isMelodyPlaying) return; // Already playing

                const blob = await getFileBlob(currentStation.melodyPath);
                if(blob) {
                    melodyAudio.src = URL.createObjectURL(blob);
                    melodyAudio.loop = true;
                    melodyAudio.play();
                    isMelodyPlaying = true;
                    updateStatus("発車メロディ再生中...");
                } else {
                    updateStatus("音声ファイルが見つかりません");
                }
            });

            // OFF Button: Stop Melody, Play Door Close
            btnOff.addEventListener('mousedown', async () => {
                btnOff.classList.add('active-state');
                btnOn.classList.remove('active-state');
                
                if(isMelodyPlaying) {
                    melodyAudio.pause();
                    melodyAudio.currentTime = 0;
                    isMelodyPlaying = false;
                }
                
                // Play Door Close sound once
                if(currentStation && currentStation.doorPath) {
                    const blob = await getFileBlob(currentStation.doorPath);
                    if(blob) {
                        subAudio.src = URL.createObjectURL(blob);
                        subAudio.loop = false;
                        subAudio.play();
                        updateStatus("ドアが閉まります");
                        setTimeout(() => updateStatus(""), 3000);
                    }
                } else {
                    updateStatus("停止");
                }
            });

            // Approach Melody Toggle
            btnApproach.addEventListener('click', async () => {
                if(!currentStation) return;
                const led = document.getElementById('led-approach');
                
                if(isApproachPlaying) {
                    subAudio.pause();
                    isApproachPlaying = false;
                    led.classList.replace('bg-green-400', 'bg-gray-400');
                    led.classList.remove('shadow-[0_0_10px_#4ade80]');
                    updateStatus("");
                } else {
                    const blob = await getFileBlob(currentStation.approachMelodyPath);
                    if(blob) {
                        subAudio.src = URL.createObjectURL(blob);
                        subAudio.loop = true;
                        subAudio.play();
                        isApproachPlaying = true;
                        led.classList.replace('bg-gray-400', 'bg-green-400');
                        led.classList.add('shadow-[0_0_10px_#4ade80]');
                        updateStatus("接近メロディ再生中");
                    }
                }
            });

            // Close Broadcast (One shot)
            btnCloseCast.addEventListener('click', async () => {
                 if(!currentStation || !currentStation.approachCastPath) return; // Using approach cast slot for simplicity or add separate
                 // Re-using logic, assuming approachCastPath is stored
                 const blob = await getFileBlob(currentStation.approachCastPath); // Actually mapped to "接近放送" in prompt, but maybe user wants "Door Close Broadcast"
                 // Let's stick to prompt mappings.
                 // Prompt says "Door Close Broadcast" button plays "Door Close Broadcast".
                 // In Station Data: we have Door Sound, Approach Melody, Approach Broadcast, Melody.
                 // Let's use Approach Broadcast for this button as per UI layout often seen.
                 if(blob) {
                     const tempAudio = new Audio(URL.createObjectURL(blob));
                     tempAudio.play();
                     updateStatus("放送再生中");
                 }
            });
            
            // Release visuals
            document.addEventListener('mouseup', () => {
                 // Keep switch visuals latching if needed, but usually push buttons reset visually but keep state logic?
                 // The prompt image is a rocker/latching switch or momentary? 
                 // Real train switches are latching or momentary depending on type. Let's assume visual stays pressed?
                 // For CSS simplicity, we just use active-state class added on click.
            });
        }

        function updateStatus(text) {
            document.getElementById('playback-status').textContent = text;
        }

        // --- 3. Line & Station Management ---

        function loadLinesFromStorage() {
            const saved = localStorage.getItem('melodyApp_lines');
            if(saved) appData.lines = JSON.parse(saved);
        }
        function saveLinesToStorage() {
            localStorage.setItem('melodyApp_lines', JSON.stringify(appData.lines));
            renderLines();
        }

        function renderLines() {
            const container = document.getElementById('lines-container');
            container.innerHTML = '';
            
            appData.lines.forEach((line, lIdx) => {
                const lineCard = document.createElement('div');
                lineCard.className = 'liquidGlass-wrapper glass-card';
                lineCard.style.setProperty('--glass-color', hexToRgba(line.color, 0.3));
                
                let stationsHtml = '';
                line.stations.forEach((st, sIdx) => {
                    stationsHtml += `
                        <div class="station-item p-3 border-b border-white/20 flex justify-between items-center bg-white/10 rounded mb-1"
                             oncontextmenu="event.preventDefault();"
                             ontouchstart="startLongPress(${lIdx}, ${sIdx})"
                             ontouchend="endLongPress()"
                             onmousedown="startLongPress(${lIdx}, ${sIdx})"
                             onmouseup="endLongPress()"
                             onclick="editStation(${lIdx}, ${sIdx})">
                            <span class="font-bold text-lg">${st.name}</span>
                            <span class="text-xs opacity-60 truncate max-w-[100px]">${getFileName(st.melodyPath)}</span>
                        </div>
                    `;
                });

                lineCard.innerHTML = `
                    <div class="liquidGlass-effect"></div>
                    <div class="liquidGlass-tint colored"></div>
                    <div class="liquidGlass-shine"></div>
                    <div class="liquidGlass-content">
                        <div class="flex justify-between items-center mb-2 border-b border-white/30 pb-2">
                            <h2 class="text-xl font-bold text-white shadow-sm" style="text-shadow:0 1px 2px rgba(0,0,0,0.3)">${line.name}</h2>
                            <button onclick="addStation(${lIdx})" class="glass-btn text-xs bg-white/40">+ 駅追加</button>
                        </div>
                        <div class="flex flex-col gap-1">
                            ${stationsHtml}
                        </div>
                        <button onclick="deleteLine(${lIdx})" class="text-xs text-red-700 mt-2 opacity-60 hover:opacity-100">路線削除</button>
                    </div>
                `;
                container.appendChild(lineCard);
            });
        }
        
        // Long Press Logic
        let pressTimer;
        function startLongPress(lIdx, sIdx) {
            pressTimer = setTimeout(() => {
                setActiveStation(lIdx, sIdx);
                navigator.vibrate(50); // Haptic feedback
                alert(`「${appData.lines[lIdx].stations[sIdx].name}」を操作盤にセットしました`);
            }, 800); // 800ms long press
        }
        function endLongPress() {
            clearTimeout(pressTimer);
        }

        function setActiveStation(lIdx, sIdx) {
            currentLine = appData.lines[lIdx];
            currentStation = currentLine.stations[sIdx];
            
            // Update UI
            document.getElementById('disp-station-name').textContent = currentStation.name;
            document.getElementById('disp-line-name').textContent = currentLine.name;
            document.getElementById('disp-line-color-bar').style.backgroundColor = currentLine.color;
            document.getElementById('current-station-display').style.setProperty('--glass-color', hexToRgba(currentLine.color, 0.4));
            
            document.getElementById('disp-melody-name').textContent = getFileName(currentStation.melodyPath);
            document.getElementById('disp-approach-melody-name').textContent = getFileName(currentStation.approachMelodyPath);
        }
        
        function getFileName(path) {
            if(!path) return '-';
            return path.split('/').pop();
        }

        // Modals
        function openLineModal() {
            document.getElementById('edit-line-name').value = '';
            document.getElementById('edit-line-color').value = '#007aff';
            document.getElementById('modal-line').classList.add('visible');
        }
        function saveLine() {
            const name = document.getElementById('edit-line-name').value;
            const color = document.getElementById('edit-line-color').value;
            if(!name) return;
            appData.lines.push({ id: Date.now(), name, color, stations: [] });
            saveLinesToStorage();
            closeModal('modal-line');
        }
        
        function deleteLine(idx) {
            if(confirm("路線を削除しますか？")) {
                appData.lines.splice(idx, 1);
                saveLinesToStorage();
            }
        }

        let editingStationRef = null;
        async function editStation(lIdx, sIdx) {
            // Short click logic (Edit)
            if(pressTimer) clearTimeout(pressTimer); // Cancel potential long press
            
            editingStationRef = { lIdx, sIdx };
            const st = appData.lines[lIdx].stations[sIdx];
            
            document.getElementById('edit-station-name').value = st.name;
            await updateSelectors(); // Ensure options are fresh
            document.getElementById('sel-melody').value = st.melodyPath || "";
            document.getElementById('sel-approach-melody').value = st.approachMelodyPath || "";
            document.getElementById('sel-door').value = st.doorPath || "";
            document.getElementById('sel-approach-cast').value = st.approachCastPath || "";
            
            document.getElementById('modal-station').classList.add('visible');
        }
        
        function addStation(lIdx) {
            appData.lines[lIdx].stations.push({
                name: '新規駅', melodyPath:'', approachMelodyPath:'', doorPath:'', approachCastPath:''
            });
            saveLinesToStorage();
            editStation(lIdx, appData.lines[lIdx].stations.length - 1);
        }

        function saveStation() {
            const {lIdx, sIdx} = editingStationRef;
            const st = appData.lines[lIdx].stations[sIdx];
            
            st.name = document.getElementById('edit-station-name').value;
            st.melodyPath = document.getElementById('sel-melody').value;
            st.approachMelodyPath = document.getElementById('sel-approach-melody').value;
            st.doorPath = document.getElementById('sel-door').value;
            st.approachCastPath = document.getElementById('sel-approach-cast').value;
            
            saveLinesToStorage();
            closeModal('modal-station');
        }
        
        function deleteStation() {
            if(confirm("駅を削除しますか？")) {
                const {lIdx, sIdx} = editingStationRef;
                appData.lines[lIdx].stations.splice(sIdx, 1);
                saveLinesToStorage();
                closeModal('modal-station');
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('visible');
        }

        // --- 4. File Management (DB) ---

        const fileInput = document.getElementById('db-upload-input');
        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if(!files.length) return;
            
            // Allow user to choose folder? For simplicity, we auto-categorize or prompt.
            // Let's implement a simple prompt or default to 'Melody'. 
            // Better: Add Upload buttons to specific folders in the UI.
            // For now: Just default to '/発車メロディ/' if can't decide, or prompt.
            
            // To make it simple: We just upload to "Root" of UI but internally assign a folder?
            // Let's prompt.
            const cat = prompt("フォルダ番号を入力:\n1: 発車メロディ\n2: 接近メロディ\n3: ドア閉\n4: 接近放送", "1");
            let folder = FOLDERS[0];
            if(cat == '2') folder = FOLDERS[1];
            if(cat == '3') folder = FOLDERS[2];
            if(cat == '4') folder = FOLDERS[3];

            for(let file of files) {
                await saveFileToDB(file, folder);
            }
            refreshFileBrowser();
            alert(`${files.length} ファイルを追加しました`);
        });

        async function refreshFileBrowser() {
            const files = await getAllFiles();
            const container = document.getElementById('file-browser');
            container.innerHTML = '';

            FOLDERS.forEach(folder => {
                const section = document.createElement('div');
                section.innerHTML = `<div class="folder-header text-xs text-gray-600">${folder}</div>`;
                
                const folderFiles = files.filter(f => f.path.startsWith(folder));
                
                if(folderFiles.length === 0) {
                     section.innerHTML += `<div class="p-2 text-xs text-gray-400 italic">なし</div>`;
                }

                folderFiles.forEach(f => {
                    const node = document.createElement('div');
                    node.className = 'file-node bg-white/40 rounded mt-1';
                    const fileName = f.path.replace(folder, '');
                    node.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-xs font-mono truncate">${fileName}</span>
                            <span class="text-[10px] text-gray-500">${(f.blob.size/1024).toFixed(1)}KB</span>
                        </div>
                        <div class="flex gap-1">
                            <button class="text-xs bg-white/50 px-2 rounded" onclick="playPreview('${f.path}')">▶</button>
                            <button class="text-xs text-red-500 bg-white/50 px-2 rounded" onclick="delFile('${f.path}')">×</button>
                        </div>
                    `;
                    section.appendChild(node);
                });
                container.appendChild(section);
            });
            
            // Update selectors in modals as well
            updateSelectors(files);
        }
        
        let previewAudio = new Audio();
        async function playPreview(path) {
            const blob = await getFileBlob(path);
            if(blob) {
                previewAudio.src = URL.createObjectURL(blob);
                previewAudio.play();
            }
        }
        
        async function delFile(path) {
            if(confirm(`${path} を削除しますか？`)) {
                await deleteFileFromDB(path);
                refreshFileBrowser();
            }
        }

        async function updateSelectors(filesData) {
            if(!filesData) filesData = await getAllFiles();
            
            const fills = [
                { id: 'sel-melody', prefix: FOLDERS[0] },
                { id: 'sel-approach-melody', prefix: FOLDERS[1] },
                { id: 'sel-door', prefix: FOLDERS[2] },
                { id: 'sel-approach-cast', prefix: FOLDERS[3] },
            ];
            
            fills.forEach(obj => {
                const sel = document.getElementById(obj.id);
                sel.innerHTML = '<option value="">(なし)</option>';
                filesData.filter(f => f.path.startsWith(obj.prefix)).forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.path;
                    opt.textContent = f.path.replace(obj.prefix, '');
                    sel.appendChild(opt);
                });
            });
        }

        // --- 5. Import / Export (Text Format) ---
        function exportLines() {
            let content = "";
            let trackCount = 1; // Simplified: assumes all are track 1 for this format or creates multiple files? 
            // The format shows "-1.line-". Let's assume we dump all stations into 1 list per line for now, 
            // or we map our "Lines" to "Tracks".
            // Since our UI is Line -> Stations, let's treat each Line in our app as a "Line" in the text file.
            
            appData.lines.forEach((line, idx) => {
                content += `Line?=${line.name}\n`;
                content += `LineColor?=${line.color}\n`;
                content += `maxtracks=1\n`; // Simplified
                content += `-1.line-\n`;
                
                line.stations.forEach(st => {
                    // Format: Station=Melody,ApproachCast,Door,ApproachMelody
                    // Paths need to be preserved
                    const lineStr = `${st.name}=${st.melodyPath},${st.approachCastPath},${st.doorPath},${st.approachMelodyPath}`;
                    content += lineStr + "\n";
                });
                content += "\n";
            });

            const blob = new Blob([content], {type: "text/plain;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "路線フォルダ設定ファイル.txt";
            a.click();
        }

        function importLines(input) {
            const file = input.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                parseImportText(text);
                saveLinesToStorage();
                renderLines();
                alert("インポート完了");
            };
            reader.readAsText(file);
        }
        
        function parseImportText(text) {
            // Very basic parser logic based on provided format
            const lines = text.split('\n');
            let currentLineObj = null;
            
            lines.forEach(row => {
                row = row.trim();
                if(!row) return;
                
                if(row.startsWith('Line?=')) {
                    const name = row.split('=')[1];
                    currentLineObj = { id: Date.now() + Math.random(), name: name, color: '#000000', stations: [] };
                    appData.lines.push(currentLineObj);
                } else if(row.startsWith('LineColor?=')) {
                    if(currentLineObj) currentLineObj.color = row.split('=')[1];
                } else if(row.startsWith('-') && row.endsWith('.line-')) {
                    // Track separator, ignore for single track simplified model
                } else if(row.includes('=')) {
                    // Station Data
                    if(!currentLineObj) return;
                    const [stName, data] = row.split('=');
                    const parts = data.split(',');
                    // Format: melody, approachCast, door, approachMelody
                    currentLineObj.stations.push({
                        name: stName,
                        melodyPath: parts[0] || '',
                        approachCastPath: parts[1] || '',
                        doorPath: parts[2] || '',
                        approachMelodyPath: parts[3] || ''
                    });
                }
            });
        }
        
        // --- 6. Zip Backup ---
        async function backupDB() {
            const zip = new JSZip();
            const files = await getAllFiles();
            
            // Add settings
            zip.file("app_settings.json", JSON.stringify(appData));
            
            // Add Audio files
            files.forEach(f => {
                // remove leading slash for zip path
                const zPath = f.path.substring(1); 
                zip.file(zPath, f.blob);
            });
            
            const content = await zip.generateAsync({type:"blob"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = "MelodySound_Backup.zip";
            a.click();
        }

        async function restoreDB(input) {
            const file = input.files[0];
            if(!file) return;
            
            try {
                const zip = await JSZip.loadAsync(file);
                
                // Clear DB? Maybe optional. For now, we overwrite/append.
                
                // Restore Settings
                const settingsFile = zip.file("app_settings.json");
                if(settingsFile) {
                    const settingsText = await settingsFile.async("string");
                    appData = JSON.parse(settingsText);
                    saveLinesToStorage();
                }
                
                // Restore Files
                const promises = [];
                zip.forEach((relativePath, zipEntry) => {
                    if(!zipEntry.dir && relativePath !== "app_settings.json") {
                        promises.push(async () => {
                            const blob = await zipEntry.async("blob");
                            // Reconstruct the full path (add leading slash)
                            // The zip structure we made was "発車メロディ/xxx.mp3". 
                            // Our DB expects "/発車メロディ/xxx.mp3".
                            let dbPath = "/" + relativePath;
                            
                            // Determine folder (simple check)
                            let folder = FOLDERS.find(f => dbPath.startsWith(f));
                            if(folder) {
                                // Since saveFileToDB logic appends filename to folder, we need to be careful.
                                // Let's create a raw put function or adjust path.
                                // Direct put is safer here.
                                const tx = db.transaction(STORE_FILES, "readwrite");
                                tx.objectStore(STORE_FILES).put({ path: dbPath, blob: blob });
                            }
                        });
                    }
                });
                
                await Promise.all(promises.map(p => p()));
                refreshFileBrowser();
                renderLines();
                alert("復元完了しました");
                
            } catch(e) {
                console.error(e);
                alert("復元に失敗しました");
            }
        }

        // --- Helpers ---
        function hexToRgba(hex, alpha) {
            let c;
            if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
                c= hex.substring(1).split('');
                if(c.length== 3){
                    c= [c[0], c[0], c[1], c[1], c[2], c[2]];
                }
                c= '0x'+c.join('');
                return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+alpha+')';
            }
            return 'rgba(0,0,0,'+alpha+')';
        }

        function updateCSS(varName, value) {
            document.documentElement.style.setProperty(varName, value);
        }
        function toggleEffect(checkbox) {
            if(checkbox.checked) {
                updateCSS('--liquid-filter', 'url(#glass-distortion)');
            } else {
                updateCSS('--liquid-filter', 'none');
            }
        }

    </script>
</body>
